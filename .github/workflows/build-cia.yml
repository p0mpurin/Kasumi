name: Build & Release Kasumi (CIA & 3DSX)

on:
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de release opcional (ej: v1.2.0). Si se deja vacío, publica en el pre-release "latest".'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install qrencode
        run: |
          apt-get update
          apt-get install -y --no-install-recommends qrencode

      - name: Install makerom and bannertool
        run: |
          mkdir -p /tmp/3ds-tools

          # makerom v0.18.3 (compatible with Debian 12 glibc 2.36; v0.19.0 requires glibc 2.38+)
          curl -fsSL -o /tmp/3ds-tools/makerom.zip \
            "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip"
          unzip -q /tmp/3ds-tools/makerom.zip -d /tmp/3ds-tools/makerom
          MAKEROM_BIN=$(find /tmp/3ds-tools/makerom -type f -name "makerom" | head -n 1)
          install -m 0755 "$MAKEROM_BIN" /usr/local/bin/makerom

          # bannertool (compiled from source to avoid GitHub API 403 rate limits and glibc mismatches)
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git /tmp/3ds-tools/3ds-bannertool
          cmake -S /tmp/3ds-tools/3ds-bannertool -B /tmp/3ds-tools/3ds-bannertool/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/3ds-tools/3ds-bannertool/build -j"$(nproc)"
          install -m 0755 /tmp/3ds-tools/3ds-bannertool/build/bannertool /usr/local/bin/bannertool

          rm -rf /tmp/3ds-tools

      - name: Build static dependencies (transport & aecm)
        run: |
          # Patch hardcoded MSYS2/Windows devkitPro paths for Linux container
          sed -i -E \
            -e "s|/c/devkitPro|${DEVKITPRO}|gi" \
            -e "s|C:/devkitPro|${DEVKITPRO}|gi" \
            -e 's|(arm-none-eabi-[a-zA-Z0-9_+-]+)\.exe|\1|g' \
            tools/transport-toolchain.cmake tools/build-transport.sh tools/build-aecm.sh
          sed -i -E 's|\.exe\b||g' tools/transport-toolchain.cmake

          bash tools/build-transport.sh
          bash tools/build-aecm.sh

      - name: Build Kasumi (.3dsx & .cia)
        run: |
          make -j"$(nproc)"
          make cia MAKEROM=/usr/local/bin/makerom BANNERTOOL=/usr/local/bin/bannertool
          sha256sum Kasumi.cia Kasumi.3dsx > SHA256SUMS

      - name: Determine release tag, artifact name, and FBI QR code
        id: release_meta
        run: |
          SAFE_REF=$(printf '%s' "${{ github.ref_name }}" | tr '/:*?"<>|\\' '-')
          SHORT_SHA=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          echo "artifact_name=Kasumi-${SAFE_REF}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAG=""
            PRERELEASE="false"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            PRERELEASE="false"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
            PRERELEASE="false"
          else
            TAG="latest"
            PRERELEASE="true"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          if [[ -n "$TAG" ]]; then
            CIA_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}/Kasumi.cia"
            QR_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}/Kasumi-qr.png"
            qrencode -s 10 -m 4 -o Kasumi-qr.png "$CIA_URL"
            echo "cia_url=$CIA_URL" >> "$GITHUB_OUTPUT"
            echo "qr_url=$QR_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release_meta.outputs.artifact_name }}
          path: |
            Kasumi.cia
            Kasumi.3dsx
            SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release with CIA and FBI QR code
        if: steps.release_meta.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            Kasumi.cia
            Kasumi.3dsx
            Kasumi-qr.png
            SHA256SUMS
          body: |
            ### Instalación en Nintendo 3DS (FBI)
            1. Abre **FBI** en tu 3DS → **Remote Install** → **Scan QR Code**.
            2. Escanea este QR para descargar e instalar `Kasumi.cia` (`${{ steps.release_meta.outputs.tag }}` — rama `${{ github.ref_name }}`, commit `${{ steps.release_meta.outputs.short_sha }}`):

            ![QR Code para FBI](${{ steps.release_meta.outputs.qr_url }})

            [Descargar Kasumi.cia](${{ steps.release_meta.outputs.cia_url }})
