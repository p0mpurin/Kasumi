name: Build & Release Kasumi (CIA & 3DSX)

on:
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de release opcional (ej: v1.2.0). Déjalo vacío para solo compilar sin publicar release.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install qrencode
        run: |
          apt-get update
          apt-get install -y --no-install-recommends qrencode

      - name: Install makerom and bannertool
        run: |
          mkdir -p /tmp/3ds-tools

          # makerom (Project_CTR)
          curl -fsSL -o /tmp/3ds-tools/makerom.zip \
            "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip"
          unzip -q /tmp/3ds-tools/makerom.zip -d /tmp/3ds-tools/makerom
          MAKEROM_BIN=$(find /tmp/3ds-tools/makerom -type f -name "makerom" | head -n 1)
          install -m 0755 "$MAKEROM_BIN" /usr/local/bin/makerom

          # bannertool (compiled from source to avoid GitHub API 403 rate limits and glibc mismatches)
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git /tmp/3ds-tools/3ds-bannertool
          cmake -S /tmp/3ds-tools/3ds-bannertool -B /tmp/3ds-tools/3ds-bannertool/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/3ds-tools/3ds-bannertool/build -j"$(nproc)"
          install -m 0755 /tmp/3ds-tools/3ds-bannertool/build/bannertool /usr/local/bin/bannertool

          rm -rf /tmp/3ds-tools

      - name: Build static dependencies (transport & aecm)
        run: |
          bash tools/build-transport.sh
          bash tools/build-aecm.sh

      - name: Build Kasumi (.3dsx & .cia)
        run: |
          make -j"$(nproc)"
          make cia MAKEROM=/usr/local/bin/makerom BANNERTOOL=/usr/local/bin/bannertool
          sha256sum Kasumi.cia Kasumi.3dsx > SHA256SUMS

      - name: Determine release tag and generate FBI QR code
        id: release_meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG=""
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ -n "$TAG" ]]; then
            CIA_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}/Kasumi.cia"
            QR_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}/Kasumi-qr.png"
            qrencode -s 10 -m 4 -o Kasumi-qr.png "$CIA_URL"
            echo "cia_url=$CIA_URL" >> "$GITHUB_OUTPUT"
            echo "qr_url=$QR_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kasumi-${{ github.ref_name }}
          path: |
            Kasumi.cia
            Kasumi.3dsx
            SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release with CIA and FBI QR code
        if: steps.release_meta.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          files: |
            Kasumi.cia
            Kasumi.3dsx
            Kasumi-qr.png
            SHA256SUMS
          body: |
            ### Instalación en Nintendo 3DS (FBI)
            1. Abre **FBI** en tu 3DS → **Remote Install** → **Scan QR Code**.
            2. Escanea este QR para descargar e instalar `Kasumi.cia` (`${{ steps.release_meta.outputs.tag }}`):

            ![QR Code para FBI](${{ steps.release_meta.outputs.qr_url }})

            [Descargar Kasumi.cia](${{ steps.release_meta.outputs.cia_url }})
