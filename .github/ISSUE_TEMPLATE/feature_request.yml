name: Feature request
description: An idea that would make Kasumi better.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      placeholder: "A way to ..."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: The game or situation where you'd use it.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mock-ups, screenshots or how another app does it.
